syntax = "proto3";
package nano.v1;

import "nano/v1/events.proto";
import "nano/v1/task.proto";

service RuntimeService {
  rpc SubmitTask(TaskRequest) returns (Task);
  rpc ControlTask(ControlTaskRequest) returns (Task);
  rpc GetTask(GetTaskRequest) returns (Task);
  rpc StreamEvents(StreamEventsRequest) returns (stream Event);
}
message ControlTaskRequest { string task_id = 1; string action = 2; }
message GetTaskRequest { string task_id = 1; }
message StreamEventsRequest { string task_id = 1; uint64 after_sequence = 2; }
