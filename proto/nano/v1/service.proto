syntax = "proto3";
package nano.v1;

import "nano/v1/events.proto";
import "nano/v1/task.proto";

service ToolService {
  rpc Execute(TaskRequest) returns (TaskResult);
  rpc ExecuteStream(TaskRequest) returns (stream Event);
  rpc Control(ControlRequest) returns (TaskResult);
  rpc Describe(DescribeRequest) returns (ServiceDescriptor);
}

message ControlRequest {
  string task_id = 1;
  string action = 2;
}
message DescribeRequest {}
message ServiceDescriptor {
  string service_name = 1;
  string version = 2;
  repeated string operations = 3;
  bool long_running = 4;
  bool supports_progress = 5;
  bool supports_heartbeat = 6;
  bool supports_pause = 7;
  bool supports_resume = 8;
  bool supports_cancel = 9;
}
